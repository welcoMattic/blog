name: Deploy to Cellar

on:
  push:
    branches: [master]
  # Publication programmée : rebuild pour mettre en ligne les articles dont la
  # date est arrivée (voir src/lib/publish.ts). Crons en UTC, sans heure d'été.
  #
  # GitHub range les crons dans une file partagée et les sert après tout le
  # reste : le passage unique de 6h30 UTC arrivait avec 6 à 12h de retard
  # (12h04, 12h46, 14h13, 18h53 les jours précédents), et l'article du matin
  # sortait l'après-midi. Deux parades. D'abord des minutes décalées, loin des
  # heures rondes et des quarts d'heure où toute la planète a programmé son
  # cron. Ensuite plusieurs passages par jour, pour qu'un retard sur le premier
  # ne repousse pas la mise en ligne à la nuit suivante. Rejouer le build ne
  # coûte rien : il est idempotent et se contente de resynchroniser Cellar.
  schedule:
    - cron: '23 4 * * *'  # 6h23 Paris l'été, 5h23 l'hiver
    - cron: '7 7 * * *'   # 9h07 Paris l'été, 8h07 l'hiver
    - cron: '41 10 * * *' # 12h41 Paris l'été, 11h41 l'hiver
    - cron: '13 16 * * *' # 18h13 Paris l'été, 17h13 l'hiver
  workflow_dispatch:

concurrency:
  group: deploy-cellar
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache du traitement images + telechargement des polices (API Fonts)
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-cache-${{ hashFiles('content/**', 'src/assets/**', 'astro.config.mjs') }}
          restore-keys: astro-cache-

      # aws CLI est preinstalle sur ubuntu-latest ; le script build + synchronise.
      - name: Build & deploy
        run: bash scripts/deploy-cellar.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CELLAR_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CELLAR_KEY_SECRET }}
